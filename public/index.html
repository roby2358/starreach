<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starreach Main Viewer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-link="connecting">
    <header class="bridge-header">
        <h1>Starreach <span>Main Viewer</span></h1>
        <dl class="readouts">
            <div><dt>Stardate</dt><dd id="stardate">--</dd></div>
            <div><dt>Sector</dt><dd id="sector">--</dd></div>
            <div><dt>Link</dt><dd id="link">--</dd></div>
        </dl>
    </header>

    <p id="notice" class="notice" hidden></p>
    <p id="outcome" class="outcome" hidden></p>

    <main id="console" class="console">
        <section class="panel">
            <div class="tabs" role="tablist" aria-label="Map">
                <button id="tab-quadrant" class="tab" type="button" role="tab" aria-controls="panel-quadrant" aria-selected="true">Quadrant</button>
                <button id="tab-galaxy" class="tab" type="button" role="tab" aria-controls="panel-galaxy" aria-selected="false">Galaxy</button>
            </div>
            <div id="panel-quadrant" role="tabpanel" aria-labelledby="tab-quadrant">
                <div id="board" class="map"></div>
                <ul class="legend">
                    <li><span class="ship"></span> Ship</li>
                    <li><span class="enemy"></span> Enemy</li>
                    <li><span class="starbase"></span> Starbase</li>
                    <li><span class="star"></span> Star</li>
                </ul>
            </div>
            <div id="panel-galaxy" role="tabpanel" aria-labelledby="tab-galaxy" hidden>
                <div id="galaxy" class="map"></div>
                <ul class="legend">
                    <li><span class="enemies">3</span> Enemies</li>
                    <li><span class="starbase"></span> Starbase</li>
                    <li><span class="dot"></span> Stars</li>
                    <li><span class="uncharted"></span> Uncharted</li>
                </ul>
            </div>
        </section>

        <section class="panel" aria-labelledby="ship-title">
            <h2 id="ship-title">Ship status</h2>
            <div id="gauges" class="gauges"></div>
            <h2>Survey</h2>
            <dl class="survey">
                <div><dt>Sectors charted</dt><dd id="charted">--</dd></div>
                <div><dt>Enemies sighted</dt><dd id="sighted">--</dd></div>
                <div><dt>Starbases found</dt><dd id="bases">--</dd></div>
            </dl>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
